<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cortex MCP Test Client</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        h1 {
            color: #333;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .card {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            margin: 15px 0;
            background-color: #f9f9f9;
        }
        #connection-status {
            font-weight: bold;
        }
        .status-connected {
            color: green;
        }
        .status-disconnected {
            color: red;
        }
        button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 10px 15px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background-color: #45a049;
        }
        pre {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
        }
        input {
            padding: 8px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 100%;
            box-sizing: border-box;
        }
        label {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Cortex MCP Test Client</h1>
    
    <div class="card">
        <h2>Connection Settings</h2>
        <div>
            <label for="server-url">Server URL:</label>
            <input type="text" id="server-url" value="http://localhost:8080/api/mcp" />
        </div>
        <div>
            <label>Status: <span id="connection-status" class="status-disconnected">Not Connected</span></label>
        </div>
        <button id="check-connection">Check Connection</button>
    </div>
    
    <div class="card">
        <h2>Echo Tool Test</h2>
        <div>
            <label for="echo-message">Message:</label>
            <input type="text" id="echo-message" value="Hello from test client!" />
        </div>
        <button id="test-echo">Test Echo Tool</button>
        <div>
            <h3>Response:</h3>
            <pre id="echo-response">No response yet</pre>
        </div>
    </div>
    
    <div class="card">
        <h2>Weather Tool Test</h2>
        <div>
            <label for="weather-location">Location:</label>
            <input type="text" id="weather-location" value="San Francisco" />
        </div>
        <button id="test-weather">Test Weather Tool</button>
        <div>
            <h3>Response:</h3>
            <pre id="weather-response">No response yet</pre>
        </div>
    </div>
    
    <div class="card">
        <h2>SSE Connection Test</h2>
        <button id="test-sse">Test SSE Connection</button>
        <div>
            <h3>Events:</h3>
            <pre id="sse-events">No events received</pre>
        </div>
    </div>
    
    <div class="card">
        <h2>Console Log</h2>
        <pre id="console-log">Logs will appear here</pre>
    </div>

    <script>
        // Custom console log to display in the UI
        const originalConsoleLog = console.log;
        const originalConsoleError = console.error;
        
        console.log = function(...args) {
            const logElement = document.getElementById('console-log');
            logElement.textContent += args.join(' ') + '\n';
            originalConsoleLog.apply(console, args);
        };
        
        console.error = function(...args) {
            const logElement = document.getElementById('console-log');
            logElement.textContent += 'ERROR: ' + args.join(' ') + '\n';
            originalConsoleError.apply(console, args);
        };
        
        // Get the base URL
        function getBaseUrl() {
            return document.getElementById('server-url').value.trim();
        }
        
        // Check connection
        document.getElementById('check-connection').addEventListener('click', async () => {
            const baseUrl = getBaseUrl();
            const statusElement = document.getElementById('connection-status');
            
            console.log(`Checking connection to ${baseUrl}...`);
            statusElement.textContent = 'Connecting...';
            statusElement.className = '';
            
            try {
                const response = await fetch(`${baseUrl}/tools`);
                if (!response.ok) {
                    throw new Error(`HTTP error: ${response.status}`);
                }
                
                const tools = await response.json();
                console.log('Connection successful! Available tools:', tools);
                statusElement.textContent = 'Connected';
                statusElement.className = 'status-connected';
            } catch (error) {
                console.error('Connection failed:', error);
                statusElement.textContent = 'Connection Failed';
                statusElement.className = 'status-disconnected';
            }
        });
        
        // Test Echo Tool
        document.getElementById('test-echo').addEventListener('click', async () => {
            const baseUrl = getBaseUrl();
            const message = document.getElementById('echo-message').value;
            const responseElement = document.getElementById('echo-response');
            
            console.log(`Testing echo tool with message: "${message}"`);
            responseElement.textContent = 'Sending request...';
            
            try {
                const response = await fetch(`${baseUrl}/run`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        tool: 'echo',
                        args: {
                            message: message
                        }
                    }),
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('Echo response:', data);
                responseElement.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                console.error('Echo test failed:', error);
                responseElement.textContent = `Error: ${error.message}`;
            }
        });
        
        // Test Weather Tool
        document.getElementById('test-weather').addEventListener('click', async () => {
            const baseUrl = getBaseUrl();
            const location = document.getElementById('weather-location').value;
            const responseElement = document.getElementById('weather-response');
            
            console.log(`Testing weather tool with location: "${location}"`);
            responseElement.textContent = 'Sending request...';
            
            try {
                const response = await fetch(`${baseUrl}/run`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        tool: 'weather',
                        args: {
                            location: location
                        }
                    }),
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error: ${response.status}`);
                }
                
                const data = await response.json();
                console.log('Weather response:', data);
                responseElement.textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                console.error('Weather test failed:', error);
                responseElement.textContent = `Error: ${error.message}`;
            }
        });
        
        // Test SSE Connection
        document.getElementById('test-sse').addEventListener('click', () => {
            const baseUrl = getBaseUrl();
            const eventsElement = document.getElementById('sse-events');
            
            console.log('Testing SSE connection...');
            eventsElement.textContent = 'Connecting to SSE...';
            
            try {
                const eventSource = new EventSource(`${baseUrl}/sse`);
                
                eventSource.onopen = () => {
                    console.log('SSE connection established');
                    eventsElement.textContent = 'Connection established, waiting for events...\n';
                };
                
                eventSource.onmessage = (event) => {
                    console.log('SSE message received:', event.data);
                    eventsElement.textContent += `Event received: ${event.data}\n`;
                };
                
                eventSource.onerror = (error) => {
                    console.error('SSE connection error:', error);
                    eventsElement.textContent += `Error: ${error}\n`;
                    eventSource.close();
                };
                
                // Close the connection after 10 seconds
                setTimeout(() => {
                    console.log('Closing SSE connection after timeout');
                    eventsElement.textContent += 'Closing connection after timeout\n';
                    eventSource.close();
                }, 10000);
                
            } catch (error) {
                console.error('SSE test failed:', error);
                eventsElement.textContent = `Error: ${error.message}`;
            }
        });
        
        // Initial log
        console.log('Test client initialized. Click buttons to run tests.');
    </script>
</body>
</html>
